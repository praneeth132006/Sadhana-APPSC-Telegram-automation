<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Influencers — Sadhana APPSC</title>
  <meta name="description" content="Influencer applications, promo codes and their terms, every sale made with a code, and withdrawals to pay.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="shared.css">
  <style>
    .inf-id { font-family: var(--font-mono, 'JetBrains Mono', monospace); font-size: 0.78rem; }
    .inf-sub { color: var(--text-muted); font-size: 0.78rem; margin-top: 2px; }
    .inf-details { max-width: 440px; white-space: pre-wrap; font-size: 0.86rem; line-height: 1.45; color: var(--text-secondary); }
    .inf-copy { margin-left: 6px; padding: 1px 7px; font-size: 0.7rem; cursor: pointer; border-radius: 999px;
      border: 1px solid var(--border-card); background: transparent; color: var(--text-muted); }
    .inf-copy:hover { color: var(--text-primary); background: var(--bg-hover); }
    .inf-form-row > td { background: var(--bg-elevated); padding: 0 16px 16px; }
    .inf-form-row .pc-form { margin-top: 12px; }
    .inf-row { cursor: pointer; }
    .inf-row:hover > td { background: var(--bg-hover); }
    .inf-row .chev { display: inline-block; width: 1em; transition: transform 150ms ease; color: var(--text-muted); }
    .inf-row.open .chev { transform: rotate(90deg); }
    .inf-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .inf-actions .btn { flex: 0 0 auto; width: auto; }
    .inf-pair { display: flex; gap: 8px; }
    .inf-pair .field-select { flex: 0 0 48%; }
    .inf-money { font-weight: 700; color: var(--text-primary); white-space: nowrap; }
    .inf-detail-meta { display: flex; flex-wrap: wrap; gap: 6px 22px; margin: 12px 0; font-size: 0.84rem; color: var(--text-secondary); }
    .inf-payto { display: grid; gap: 3px; font-size: 0.82rem; min-width: 220px; }
    .inf-payto .inf-sub { display: inline; margin: 0; }
    .inf-subhead { margin: 16px 0 8px; font-size: 0.84rem; font-weight: 700; color: var(--text-primary); }
    .inf-howto { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 18px 28px; }
    .inf-howto ol { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 0.88rem; color: var(--text-secondary); }
    .inf-howto h3 { font-size: 0.9rem; margin: 0 0 8px; }
    .inf-toolbar-filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .inf-toolbar-filters .field-input { min-width: 240px; }
    @media (max-width: 720px) {
      .inf-toolbar-filters, .inf-toolbar-filters .field-input, .inf-toolbar-filters .field-select { width: 100%; min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <main id="pageRoot" class="page-root" style="display:none">
      <div class="page-header">
        <div>
          <h1 class="page-title">Influencers</h1>
          <p class="page-subtitle">
            Applications from the influencer bot, the promo code each approval creates, every sale made with a code,
            and withdrawals to pay — for every exam at once, stored in the Affiliate Marketing sheet.
          </p>
        </div>
        <div class="page-actions">
          <span id="botBadge" class="hint-text"></span>
          <button id="helpBtn" class="btn btn-ghost" aria-expanded="false" aria-controls="howItWorks">How this works</button>
          <a id="sheetLink" class="btn btn-ghost" target="_blank" rel="noopener" hidden>📄 Open sheet</a>
          <button id="exportBtn" class="btn btn-ghost" title="Download every sale as a spreadsheet">⬇ Export CSV</button>
          <button id="refreshBtn" class="btn btn-primary">Refresh</button>
        </div>
      </div>

      <section id="howItWorks" class="panel sp-howto" hidden></section>
      <div id="notices"></div>

      <div id="statGrid" class="stat-grid" aria-label="Influencer programme at a glance"></div>

      <div class="sp-toolbar">
        <div id="tabs" class="sp-tabs" role="tablist" aria-label="Section"></div>
        <div class="inf-toolbar-filters">
          <select id="examFilter" class="field-select" aria-label="Filter by exam"><option value="all">Every exam</option></select>
          <input id="searchInput" type="search" class="field-input"
                 placeholder="Search name, @username, Telegram id, code or payment id" aria-label="Search">
        </div>
      </div>

      <div id="tabBody"></div>
    </main>
  </div>

  <script type="module" src="influencers.js"></script>
</body>
</html>
